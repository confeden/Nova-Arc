[workspace]
resolver = "2"
members = ["crates/nova-core", "crates/nova-cli", "crates/nova-platform", "crates/nova-gui", "crates/nova-bsc", "crates/nova-lzma"]

[workspace.package]
version = "0.9.0"
edition = "2021"
repository = "https://github.com/confeden/Nova-Prism"
authors = ["Brent"]
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
fastcdc = "3"
lzma-rust2 = "0.19"
ppmd-rust = "1.4"
# Exact pin: preflate's correction-record format is not stable across
# versions, and filter id 34 means "records written by 0.7.x" forever.
preflate-rs = "=0.7.6"
# Same reasoning as preflate: the Lepton bitstream is tied to the encoder, and
# filter id 35 means "written by 0.5.x" forever.
lepton_jpeg = "=0.5.8"
# The stored payload is a STANDARD FLAC stream, so unlike ids 34/35/37 the
# encoder is not pinned by filter id 38 — only this decoder has to keep reading
# what earlier encoders wrote, which any conforming FLAC decoder does.
flacenc = { version = "0.5", default-features = false }
claxon = "0.4"
filetime = "0.2"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
sevenz-rust2 = "0.21"
tempfile = "3"
# Extraction only, and OFF BY DEFAULT (feature `rar`). The wrapper is
# MIT/Apache-2.0 but it vendors RARLAB's unrar sources, whose licence is not
# OSI and is GPL-incompatible: keeping it behind a feature means the default
# build carries none of it and nova's own licence stays an open choice.
# Creating RAR is forbidden by that licence and is not planned.
unrar = "0.5"
walkdir = "2"
windows-sys = "0.60"
zip = "8"
zstd = "0.13"
