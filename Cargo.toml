[workspace]
resolver = "2"
members = ["crates/narc-core", "crates/narc-cli", "crates/narc-platform"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/confeden/Nova-Arc"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
fastcdc = "3"
lzma-rust2 = "0.19"
ppmd-rust = "1.4"
filetime = "0.2"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
walkdir = "2"
windows-sys = "0.60"
zstd = "0.13"
