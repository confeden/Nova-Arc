[package]
name = "nova-bsc"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "libbsc (BWT + QLFC) behind a safe Rust API for Nova Prism"

# This crate exists for one reason: nova-core is `#![forbid(unsafe_code)]` and
# libbsc is C++. All of the FFI lives here, the way all OS calls live in
# nova-platform.

[dependencies]
anyhow.workspace = true

[build-dependencies]
cc = "1"
