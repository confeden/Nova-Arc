[package]
name = "narc-gui"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Nova Arc desktop application"

[[bin]]
name = "nova-arc"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
narc-core = { path = "../narc-core" }
narc-platform = { path = "../narc-platform" }
serde.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
# Keeps `cargo build` for the workspace from needing a frontend bundle.
custom-protocol = ["tauri/custom-protocol"]
